<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges" role="img" aria-label="Folder icon">
  <!-- back tab -->
  <rect x="1" y="3" width="6" height="1" fill="#000000" />
  <rect x="1" y="4" width="7" height="1" fill="#000000" />
  <rect x="1" y="4" width="6" height="1" fill="#ffe680" />
  <rect x="2" y="5" width="5" height="1" fill="#f4c430" />

  <!-- folder body outline -->
  <rect x="0" y="5" width="1" height="9" fill="#000000" />
  <rect x="15" y="6" width="1" height="8" fill="#000000" />
  <rect x="1" y="13" width="14" height="1" fill="#000000" />
  <rect x="1" y="6" width="14" height="1" fill="#000000" />

  <!-- folder body fill -->
  <rect x="1" y="7" width="14" height="6" fill="#f4c430" />

  <!-- top highlight -->
  <rect x="1" y="7" width="14" height="1" fill="#ffe680" />

  <!-- bottom shadow -->
  <rect x="1" y="12" width="14" height="1" fill="#c68a00" />

  <!-- right edge shading -->
  <rect x="13" y="7" width="1" height="5" fill="#d99a00" />
  <rect x="14" y="7" width="1" height="5" fill="#c68a00" />
</svg>
